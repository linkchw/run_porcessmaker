name: ${COMPOSE_PROJECT_NAME:-rashen-processmaker}

x-app-common: &app-common
  image: linkchw/processmaker:3.8.3-bba01d8@sha256:9dbf42dfe0ad5daf6b956dbcc10e4e1f3f4cb7a2ea5fa57793132353d01e312d
  platform: linux/amd64
  environment:
    PM_DB_HOST: db
    PM_DB_PORT: "3306"
    PM_DB_ROOT_USER: root
    PM_DB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    PM_DB_NAME: ${PM_DB_NAME:-workflow}
    PM_WORKSPACE: ${PM_WORKSPACE:-workflow}
    PM_ADMIN_USER: ${PM_ADMIN_USER:-admin}
    PM_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    PM_DEFAULT_LANG: ${PM_DEFAULT_LANG:-fa}
    PM_PUBLIC_HOST: ${PM_PUBLIC_HOST:-localhost}
    PM_PUBLIC_PORT: ${PM_PUBLIC_PORT:-8080}
    PM_PUBLIC_SCHEME: ${PM_PUBLIC_SCHEME:-http}
    PHP_DATE_TIMEZONE: ${PHP_DATE_TIMEZONE:-Asia/Tehran}
    PM_SCHEDULER_INTERVAL_SECONDS: ${PM_SCHEDULER_INTERVAL_SECONDS:-60}
  secrets:
    - db_root_password
    - admin_password
  volumes:
    # The pinned compatibility image declares /opt/processmaker as a Docker
    # volume. Make that volume explicit so Compose does not create an
    # anonymous, unmanageable volume during upgrades.
    - app_state:/opt/processmaker
    - shared_state:/opt/processmaker/shared
    # Persistent, host-managed assets (logos and Dynaform images). This must
    # be writable because initialization normalizes ownership and the admin
    # settings upload writes into this directory.
    - ${PUBLIC_ASSETS_PATH:-./public-assets}:/opt/processmaker/public-assets
    # The initializer updates this file with the exact deployed image/source.
    - ./public/source-release.json:/opt/processmaker/workflow/public_html/source-release.json
    - ./scripts/processmaker-scheduler.sh:/opt/nitel/processmaker-scheduler.sh:ro
    - ./scripts/processmaker-cron-bootstrap.php:/opt/nitel/processmaker-cron-bootstrap.php:ro
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${PM_DB_NAME:-workflow}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      PM_DB_NAME: ${PM_DB_NAME:-workflow}
    secrets:
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306"
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot --password="$$(cat /run/secrets/db_root_password)" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  initialize:
    <<: *app-common
    entrypoint:
      - /opt/nitel/bootstrap/initialize.sh
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-common
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8080/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *app-common
    # Required while ProcessMaker asynchronous routing is enabled (the default).
    # It consumes RouteCase jobs that create the next delegation and assignee.
    entrypoint:
      - php
      - /opt/processmaker/processmaker
    command:
      - artisan
      - queue:work
      - --workspace=${PM_WORKSPACE:-workflow}
      - --sleep=${PM_QUEUE_SLEEP:-3}
      - --max-time=${PM_QUEUE_MAX_TIME:-3600}
      - --memory=${PM_QUEUE_MEMORY:-256}
    user: www-data
    working_dir: /opt/processmaker
    depends_on:
      initialize:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 1m
    restart: unless-stopped

  scheduler:
    <<: *app-common
    # Runs timers, scheduled cases, message events, notifications, and upkeep.
    # This is a singleton; do not scale it above one replica.
    entrypoint:
      - bash
      - /opt/nitel/processmaker-scheduler.sh
    user: www-data
    working_dir: /opt/processmaker
    depends_on:
      initialize:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 2m
    restart: unless-stopped

networks:
  backend: {}

volumes:
  db_data: {}
  app_state: {}
  shared_state: {}

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
